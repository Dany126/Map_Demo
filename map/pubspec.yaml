name: map
description: "A clean, highly configurable, reusable Flutter Map package built on top of flutter_map and OpenStreetMap."
version: 1.0.0
homepage: https://github.com/Dany126/Map_Demo
repository: https://github.com/Dany126/Map_Demo
issue_tracker: https://github.com/Dany126/Map_Demo/issues

environment:
  sdk: ^3.13.4
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  dartz: ^0.10.1
  geolocator: ^14.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
